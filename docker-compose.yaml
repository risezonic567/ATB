version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atb_backend
    restart: always
    ports:
      # Host nginx should proxy /api + /enquiry → 5012
      - "5012:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      MONGO_URL: mongodb://mongo:27017/atb
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atb_frontend
    restart: always
    ports:
      - "3800:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: atb_mongo
    restart: always
    ports:
      - "27020:27017"
    volumes:
      - atb_mongo_data:/data/db

volumes:
  atb_mongo_data:
