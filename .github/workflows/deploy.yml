name: atb is auto deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ssh deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            echo "=== deploy start ==="
            cd /var/www/ATB
            echo "=== git pull ==="
            git pull origin main
            echo "=== remove exited ATB containers only ==="
            exited_ids=$(docker ps -aq --filter "name=atb" --filter "status=exited" || true)
            if [ -n "$exited_ids" ]; then
              docker rm -f $exited_ids || true
            fi
            echo "=== docker compose up (v2) ==="
            docker compose up -d --build
            echo "=== status ==="
            docker ps --filter "name=atb_frontend"
            echo "=== deploy done ==="
