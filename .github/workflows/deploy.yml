name: atb is auto deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ssh deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/ATB
            git pull origin main
            # Only remove exited/broken ATB containers (never touch other projects)
            docker ps -aq --filter "name=atb" --filter "status=exited" | xargs -r docker rm -f
            # Use Docker Compose v2 (avoids ContainerConfig bug in docker-compose 1.29)
            docker compose up -d --build
            docker ps --filter "name=atb_frontend"
